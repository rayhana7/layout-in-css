<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 2</title>
    <link rel="stylesheet" href="../style.css">
    <style>

      body{ 
        display: grid;
        grid-template-columns: 2fr 3fr;
        /*kolommen zijn altijd verticaal (boven naar beneden)*/
        grid-template-rows: 2fr 1fr 8fr 1.5fr;
        /*rijen zijn altijd horizontaal (links naar rechts*/ /*in dit geval zijn er 4 rijen*/
        gap: 1em;
      }

      header { 
        
        grid-column-start: 1;
        grid-column-end: 3;
      
      }
     nav { 
      grid-column-start: 1;
      grid-column-end: 3;
      grid-row-start: 2;
      grid-row-end: 3;
      

     }

    main {
      grid-column-start: 1;
      grid-column-end: 3;
      grid-row-start: 3;
      grid-row-end: 4;
      


    }

    footer {
      grid-column-start: 1;
      grid-column-end: 3;
      grid-row-start: 4;
      grid-row-end: 5;
      
    }

    </style>
  </head>
  <body id="basic-layout-2">
    <header><h1>Basic Layout 2</h1></header>
    <nav><a href="../index.html">Terug naar het overzicht</a></nav>
    <main></main>
    <footer></footer>
  </body>
</html>
